<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المساعد الذكي لطلاب</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101010;
    color: white;
    text-align: center;
}

header {
    padding: 30px 15px;
    color: #d4af37;
}

h1 {
    font-size: 30px;
}

.container {
    max-width: 700px;
    margin: 20px auto;
    padding: 25px;
}

textarea {
    width: 100%;
    height: 130px;
    padding: 12px;
    border-radius: 10px;
    font-size: 16px;
}

button, select {
    padding: 12px 20px;
    margin: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

button {
    background: #d4af37;
    color: #000;
    font-weight: bold;
}

button:disabled {
    opacity: 0.6;
}

#answer {
    margin-top: 20px;
    padding: 15px;
    background: #222;
    border-radius: 10px;
    line-height: 1.8;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    text-align: left;
}

select {
    background: white;
    color: black;
}
</style>
</head>

<body>

<header>
    <h1>المساعد الذكي لطلاب</h1>
    <p id="subtitle">Votre assistant intelligent pour les études</p>

    <select id="language" onchange="changeLanguage()">
        <option value="fr">Français</option>
        <option value="en">English</option>
    </select>
</header>

<main class="container">

    <h2 id="questionTitle">Posez votre question</h2>

    <textarea id="question"
        placeholder="Écrivez votre question ici..."></textarea>

    <br>

    <button id="askButton" onclick="askQuestion()">
        Poser la question
    </button>

    <div id="answer">
        Votre réponse apparaîtra ici.
    </div>

</main>

<script>
const WORKER_URL =
"https://assistant-etudiants-ai.mednouhsamba182.workers.dev/";

function changeLanguage() {
    const lang = document.getElementById("language").value;

    document.getElementById("subtitle").textContent =
        lang === "en"
        ? "Your intelligent study assistant"
        : "Votre assistant intelligent pour les études";

    document.getElementById("questionTitle").textContent =
        lang === "en" ? "Ask your question" : "Posez votre question";

    document.getElementById("question").placeholder =
        lang === "en"
        ? "Write your question here..."
        : "Écrivez votre question ici...";

    document.getElementById("askButton").textContent =
        lang === "en" ? "Ask question" : "Poser la question";

    document.getElementById("answer").textContent =
        lang === "en"
        ? "Your answer will appear here."
        : "Votre réponse apparaîtra ici.";
}

async function askQuestion() {
    const lang = document.getElementById("language").value;
    const question = document.getElementById("question").value.trim();
    const answer = document.getElementById("answer");
    const button = document.getElementById("askButton");

    if (!question) {
        answer.textContent =
            lang === "en"
            ? "Please write a question first."
            : "Veuillez écrire une question d'abord.";
        return;
    }

    button.disabled = true;
    answer.textContent =
        lang === "en"
        ? "Thinking... Please wait."
        : "Réflexion en cours... Veuillez patienter.";

    try {
        const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.details || data.error || "Request failed"
            );
        }

        if (!data.answer) {
            throw new Error(data.error || "No answer received");
        }

        answer.textContent = data.answer;

    } catch (error) {
        console.error(error);

        answer.textContent =
            (lang === "en"
            ? "Connection error: "
            : "Erreur de connexion : ")
            + error.message;

    } finally {
        button.disabled = false;
    }
}
</script>

</body>
</html>
